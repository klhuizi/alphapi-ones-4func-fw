name: Build 4func firmware
on: [push, workflow_dispatch]
permissions:
  contents: read
  actions: write
jobs:
  build:
    runs-on: ubuntu-22.04
    container: espressif/idf:release-v6.1
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          set +e
          python3 ci_build.py > build.log 2>&1
          RC=$?
          echo "BUILD_EXIT_CODE=$RC"
          echo "===== KEY LINES (annotations) ====="
          grep -iE "=== STEP|error|fatal|Traceback|Exception|FAILED|No such file|non-zero|missing|denied|unauthorized|BUILD DONE|download|collected|patching|Hunk" build.log | tail -40 | while IFS= read -r line; do echo "::error::${line}"; done
          echo "===== TAIL (annotations) ====="
          tail -20 build.log | while IFS= read -r line; do echo "::error::${line}"; done
          {
            echo "## Build result (exit $RC)"
            echo '```'
            tail -120 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $RC
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: alphapi-4func-firmware
          path: out/*
          if-no-files-found: error
