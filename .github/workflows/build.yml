name: Build 4func firmware
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    container: espressif/idf:release-v6.1
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          set +e
          (
            echo "=== ENV ==="
            echo "IDF_PATH=$IDF_PATH"
            python3 --version
            which patch || echo "NO PATCH"
            echo "=== START CI BUILD ==="
            python3 ci_build.py
            echo "=== CI BUILD EXIT: $? ==="
          ) 2>&1 | tee build.log
          echo "PIPE_STATUS=${PIPESTATUS[0]}" | tee -a build.log
          exit ${PIPESTATUS[0]}
      - name: Upload log always
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: alphapi-4func-firmware
          path: out/*
          if-no-files-found: error
