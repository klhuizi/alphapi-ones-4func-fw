name: Build 4func firmware
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    container: espressif/idf:release-v6.1
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          apt-get update -qq && apt-get install -y -qq patch >/dev/null
          python3 ci_build.py
      - uses: actions/upload-artifact@v4
        with:
          name: alphapi-4func-firmware
          path: out/*
          if-no-files-found: error
