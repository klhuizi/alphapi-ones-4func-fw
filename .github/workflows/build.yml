name: Build 4func firmware
on: [push, workflow_dispatch]
permissions:
  contents: read
  actions: write
jobs:
  build:
    runs-on: ubuntu-22.04
    container: espressif/idf:release-v6.1
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          set +e
          python3 ci_build.py > build.log 2>&1
          RC=$?
          echo "BUILD_EXIT_CODE=$RC"
          echo "===== publish full log ====="
          PASTE_URL=$(curl -s --max-time 40 -X POST --data-binary @build.log https://paste.rs/ 2>/dev/null | tr -d '\n\r')
          echo "::error::BUILD_RC=${RC} LOG=${PASTE_URL:-none}"
          echo "===== real error lines ====="
          grep -iE "error:|FAILED:|CMake Error|Traceback|ninja: build stopped|undefined reference|No rule to make" build.log | tail -30 | while IFS= read -r line; do echo "::error::${line}"; done
          tail -8 build.log | while IFS= read -r line; do echo "::error::TAIL ${line}"; done
          exit $RC
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: alphapi-4func-firmware
          path: out/*
          if-no-files-found: error
